<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlgoLib 算法管理平台</title>
  <style>
    :root {
      --bg-deep: #060f1e;
      --bg-nav: #081528;
      --bg-card: #0c1e38;
      --bg-card2: #0f2448;
      --primary: #1e90ff;
      --accent: #00f0c8;
      --success: #00c48c;
      --warning: #f5a623;
      --danger: #ff4d6a;
      --snippet: #a855f7;
      --text: #c8d8f0;
      --text-dim: #6a8ab0;
      --line: rgba(106, 138, 176, .28);
      --shadow: 0 18px 50px rgba(0, 0, 0, .32);
      --bg: var(--bg-deep);
      --border: var(--line);
      --text-secondary: var(--text-dim);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg-deep);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--bg-card2);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    button:hover { border-color: var(--primary); color: #fff; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button.primary { border-color: transparent; background: var(--primary); color: #fff; }
    button.success { border-color: rgba(0, 196, 140, .45); background: rgba(0, 196, 140, .16); color: var(--success); }
    button.danger { border-color: rgba(255, 77, 106, .45); background: rgba(255, 77, 106, .14); color: #ffb7c4; }
    button.warning { border-color: rgba(245, 166, 35, .45); background: rgba(245, 166, 35, .14); color: #f5a623; }
    button.ghost { background: transparent; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #07162b;
      color: var(--text);
      border-radius: 6px;
      padding: 9px 10px;
      outline: none;
    }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 180px 1fr;
      grid-template-rows: 1fr 28px;
      background: var(--bg-deep);
    }
    .sidebar {
      grid-row: 1;
      background: var(--bg-nav);
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      overflow: auto;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(30,144,255,.25); border-radius: 4px; }
    .sidebar::-webkit-scrollbar-thumb:hover { background: rgba(30,144,255,.55); }
    .brand {
      margin: 4px 8px 18px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .brand span { color: var(--accent); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(30, 144, 255, .14);
      color: #fff;
    }
    .nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 14px var(--primary);
    }
    .nav-sub {
      margin: 0 0 2px 26px;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
      opacity: .85;
    }
    .nav-sub:hover { color: #fff; background: rgba(30, 144, 255, .10); opacity: 1; }
    .nav-sub.active-sub { color: var(--accent); font-weight: 600; font-size: 12px; opacity: 1; }
    .folder-section.nav-highlight { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .nav-collapse-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0 4px;
      font-size: 11px;
      line-height: 1;
      opacity: .65;
      transition: transform .2s;
    }
    .nav-collapse-btn.collapsed { transform: rotate(-90deg); }
    .nav-sub-group { overflow: hidden; max-height: 400px; transition: max-height .28s ease; }
    .nav-sub-group.collapsed { max-height: 0; }
    .nav-item { position: relative; }
    .main {
      grid-row: 1;
      min-width: 0;
      overflow: auto;
      padding: 20px 24px 34px;
      position: relative;
    }
    .main.editor-active {
      padding: 0;
      overflow: hidden;
    }
    .main::-webkit-scrollbar { width: 6px; height: 6px; }
    .main::-webkit-scrollbar-track { background: var(--bg-nav); }
    .main::-webkit-scrollbar-thumb { background: rgba(30,144,255,.25); border-radius: 4px; }
    .main::-webkit-scrollbar-thumb:hover { background: rgba(30,144,255,.55); }
    .statusbar {
      grid-column: 1 / 3;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 12px;
      background: #041022;
      border-top: 1px solid var(--line);
      color: var(--text-dim);
      font-size: 12px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      color: #fff;
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar input { max-width: 250px; }
    .toolbar select { max-width: 145px; }
    .toolbar button { min-width: 72px; padding: 8px 10px; }
    .toolbar-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .new-workspace {
      min-height: calc(100vh - 84px);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 12px;
    }
    .template-usage-details {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 10px 14px;
    }
    .template-usage-details summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--primary);
      user-select: none;
    }
    .template-usage-body {
      margin-top: 8px;
      white-space: pre-wrap;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.6;
    }
    .new-form-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }
    .new-form-grid label { display: grid; gap: 4px; color: var(--text-dim); font-size: 12px; }
    .new-form-grid .wide { grid-column: span 2; }
    .new-form-grid .full { grid-column: 1 / -1; }
    .file-editor-grid {
      min-height: 420px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px;
    }
    .file-list-panel {
      background: #07162b;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
    }
    .file-list-panel button {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(106, 138, 176, .14);
      border-radius: 0;
      text-align: left;
    }
    .file-list-panel button.active { color: #fff; background: rgba(30, 144, 255, .18); }
    .file-edit-area {
      min-height: 420px;
      font: 13px/1.5 Consolas, "Courier New", monospace;
    }
    .workspace-monaco-host {
      min-height: 300px;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #040e1f;
    }
    .code-check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(15, 36, 72, .55);
      color: var(--text-dim);
      font-size: 12px;
    }
    .spacer { flex: 1; }
    .stat-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px 16px;
      position: relative;
    }
    .stat-card.accent-warning { border-left: 3px solid #f5a623; }
    .stat-card.accent-success { border-left: 3px solid var(--success); }
    .stat-card.accent-info { border-left: 3px solid var(--accent); }
    .stat-label { color: var(--text-dim); font-size: 12px; }
    .stat-value { margin-top: 4px; color: #fff; font-size: 22px; font-weight: 700; }
    .stat-value.accent-warning { color: #f5a623; }
    .stat-desc { margin-top: 2px; color: var(--text-dim); font-size: 11px; }

    .review-banner {
      background: rgba(245, 166, 35, .1);
      border: 1px solid rgba(245, 166, 35, .35);
      border-radius: 6px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: #f5a623;
      font-size: 13px;
    }
    .review-banner .spacer { flex: 1; }
    .review-banner a { color: #f5a623; text-decoration: underline; cursor: pointer; }

    .quick-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .quick-filters button {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-dim);
      cursor: pointer;
    }
    .quick-filters button.active {
      background: rgba(88, 166, 255, .15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .quick-filters button.qf-warning.active {
      background: rgba(245, 166, 35, .15);
      border-color: #f5a623;
      color: #f5a623;
    }
    .quick-filters button.qf-success.active {
      background: rgba(0, 196, 140, .15);
      border-color: var(--success);
      color: var(--success);
    }

    .folder-section {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 10px;
    }
    .folder-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .folder-head h3 { margin: 0; color: #fff; font-size: 15px; }
    .folder-head .count { color: var(--text-dim); }
    .folder-body {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 1100px) {
      .folder-body { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .folder-body { grid-template-columns: 1fr; }
    }
    .folder-section.collapsed .folder-body { display: none; }
    .folder-section.collapsed .folder-toggle { transform: rotate(-90deg); }
    .folder-toggle { width: 32px; padding: 4px 0; font-size: 22px; transition: transform .16s ease; }
    .more-menu-item { padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--text); white-space: nowrap; }
    .more-menu-item:hover { background: var(--bg-hover, rgba(255,255,255,.06)); }
    .more-menu-item.danger { color: var(--danger, #e05c5c); }

    .algo-card {
      min-height: 130px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 10px 12px;
      position: relative;
    }
    .algo-card.template { border-left-color: var(--success); }
    .algo-card.snippet { border-left-color: var(--snippet); }
    .algo-card.highlight { animation: highlight 2s ease; }
    .readme-view { padding-bottom: 32px; }
    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 16px;
    }
    .panel-card h2 {
      margin: 0 0 10px;
      color: #fff;
      font-size: 16px;
    }
    .panel-card h2:not(:first-child) { margin-top: 18px; }
    .code-block {
      margin: 0;
      background: #040e1f;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      font: 12px/1.6 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-badge { position: absolute; top: 10px; right: 10px; }
    @keyframes highlight {
      0%, 100% { box-shadow: none; }
      20%, 70% { box-shadow: 0 0 0 2px var(--accent), 0 0 26px rgba(0, 240, 200, .28); }
    }
    .card-title { color: #fff; font-size: 16px; font-weight: 700; }
    .card-ns {
      color: var(--accent);
      font: 12px/1.4 Consolas, "Courier New", monospace;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .desc {
      min-height: 42px;
      color: var(--text-dim);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .tag.success { color: var(--success); border-color: rgba(0, 196, 140, .42); }
    .tag.warning { color: var(--warning); border-color: rgba(245, 166, 35, .42); }
    .tag.danger { color: var(--danger); border-color: rgba(255, 77, 106, .42); }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

    .skeleton {
      height: 172px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--bg-card), var(--bg-card2), var(--bg-card));
      background-size: 240% 100%;
      animation: shine 1.1s infinite;
    }
    @keyframes shine { to { background-position: -240% 0; } }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 28px;
      text-align: center;
      color: var(--text-dim);
    }

    .editor-view {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 40px 1fr var(--vbar-h, 2px) minmax(0, var(--test-height, 0px));
      background: #040e1f;
      border: none;
      border-radius: 0;
      overflow: hidden;
    }
    /* ===== 编辑器顶部两行 ===== */
    .editor-top-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      min-height: 44px;
      background: #07111f;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow: hidden;
    }
    .editor-top-info .breadcrumb { flex-shrink: 0; color: var(--text-dim); font-size: 13px; white-space: nowrap; line-height: 1; }
    .editor-top-info .ns-prefix { font: 13px/1 Consolas, "Courier New", monospace; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
    .editor-top-info .namespace-edit { flex-shrink: 0; position: relative; min-width: 0; }
    .editor-top-info .namespace-edit input { height: 28px; padding: 3px 10px; font: 13px/1.2 Consolas, "Courier New", monospace; min-width: 140px; max-width: 260px; width: auto; border-radius: 4px; }
    .editor-top-info .namespace-edit #nsErr { position: absolute; top: calc(100% + 2px); left: 0; white-space: nowrap; z-index: 5; background: #07111f; padding: 2px 4px; border-radius: 3px; }
    .editor-notice {
      margin-left: auto;
      flex-shrink: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      color: var(--warning);
      white-space: nowrap;
    }
    .editor-toolbar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 5px;
      padding: 0 10px;
      height: 40px;
      min-height: 40px;
      max-height: 40px;
      background: var(--bg-card);
      border-bottom: 2px solid var(--line);
      flex-shrink: 0;
      overflow: hidden;
    }
    .toolbar-divider { width: 1px; height: 20px; background: rgba(106,138,176,.3); margin: 0 4px; flex-shrink: 0; }
    /* Block 操作按钮 */
    .editor-toolbar .block-action {
      border-color: rgba(0,240,200,.25) !important;
      background: rgba(0,240,200,.06) !important;
      color: var(--accent) !important;
      font-size: 12px;
      padding: 4px 9px;
    }
    .editor-toolbar .block-action:hover {
      border-color: var(--accent) !important;
      background: rgba(0,240,200,.12) !important;
    }
    .editor-toolbar .block-action.active {
      background: rgba(0,240,200,.18) !important;
      border-color: var(--accent) !important;
    }
    /* 算法操作按钮 */
    .editor-toolbar button { font-size: 12px; padding: 4px 9px; }
    .namespace-edit.invalid input { border-color: var(--danger); }
    .field-error { min-height: 12px; color: var(--danger); font-size: 11px; }
    .editor-main {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: var(--tree-width, 232px) 5px 1fr var(--rpanel-bar, 0px) var(--rpanel-w, 0px);
    }
    .file-tree {
      min-width: 120px;
      max-width: 320px;
      overflow: auto;
      background: #07162b;
      border-right: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .file-tree-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid rgba(106, 138, 176, .16);
      color: var(--text-dim);
      font-size: 12px;
    }
    .file-item {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(106, 138, 176, .12);
      cursor: pointer;
    }
    .file-item.active { background: rgba(30, 144, 255, .18); color: #fff; }
    .file-name { font-family: Consolas, "Courier New", monospace; }
    .file-functions { margin-top: 3px; color: var(--text-dim); font-size: 12px; }
    .tree-resize { background: #0b1d38; cursor: col-resize; }
    .monaco-host { min-width: 0; min-height: 0; }
    .snippet-editor {
      grid-template-rows: auto auto 1fr;
      background: #07111f;
    }
    .snippet-editor .editor-top-info {
      height: auto;
      min-height: 40px;
      max-height: none;
      padding: 6px 12px;
      background: #07111f;
      flex-wrap: nowrap;
    }
    .snippet-meta {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) 120px 120px minmax(240px, 2fr);
      gap: 10px;
      padding: 10px 12px;
      background: #0b1a31;
      border-bottom: 1px solid var(--line);
    }
    .snippet-meta .form-row,
    .snippet-top-field {
      margin: 0;
      min-width: 0;
    }
    .snippet-meta label,
    .snippet-top-field label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .snippet-code-shell {
      display: grid;
      grid-template-rows: 32px 1fr;
      min-height: 0;
      background: #040e1f;
    }
    .snippet-code-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--text-dim);
      background: #07162b;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .v-resize-bar {
      height: var(--vbar-h, 2px);
      background: #0b1d38;
      border-top: 1px solid var(--line);
      cursor: row-resize;
      flex-shrink: 0;
      transition: background .15s;
    }
    .v-resize-bar:hover { background: rgba(88,166,255,.18); }
    /* ── IDE 底部面板 ── */
    .panel-resize-bar {
      height: 0;
      background: transparent;
      cursor: row-resize;
      flex-shrink: 0;
      transition: background .15s, height .1s;
    }
    .panel-resize-bar.visible {
      height: 4px;
    }
    .panel-resize-bar.visible:hover { background: rgba(88,166,255,.2); }
    .bottom-panel {
      height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: #07162b;
      border-top: 1px solid var(--line);
    }
    .bottom-panel.open { height: var(--panel-h, 220px); }
    .panel-tabs {
      display: flex;
      align-items: center;
      background: #040e1f;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      padding: 0 4px;
    }
    .panel-tab {
      padding: 4px 14px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      border-bottom: 2px solid transparent;
      transition: color .15s;
    }
    .panel-tab:hover { color: var(--text); }
    .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .panel-close-btn {
      margin-left: auto;
      padding: 2px 8px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
    }
    .panel-close-btn:hover { color: var(--text); }

      width: min(720px, calc(100vw - 28px));
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .snippet-result {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .snippet-result:hover, .snippet-result.active { background: rgba(30, 144, 255, .14); }
    .snippet-preview { color: var(--text-dim); font: 12px Consolas, "Courier New", monospace; }
    .modal-backdrop {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal h3 { margin: 0 0 12px; color: #fff; }
    .form-grid { display: grid; gap: 10px; }
    .form-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; }
    .form-row label { padding-top: 9px; color: var(--text-dim); }
    .field-error { color: var(--danger, #f87171); font-size: 12px; margin-top: 4px; grid-column: 2; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .invalid-field { border-color: var(--danger) !important; }
    .widget-config-panel {
      border: 1px solid var(--line);
      background: rgba(12,30,56,.72);
      border-radius: 8px;
      padding: 12px;
      margin: 0 0 14px;
    }
    .widget-config-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .widget-config-title { color: var(--text); font-weight: 700; font-size: 14px; }
    .widget-config-desc { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
    .widget-config-list { display: grid; gap: 8px; }
    .widget-config-row {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) minmax(130px, 1.2fr) minmax(160px, 1.2fr) 90px;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid rgba(106,138,176,.22);
      border-radius: 6px;
      background: rgba(6,15,30,.55);
    }
    .widget-param-name {
      color: var(--accent);
      font-family: Consolas, Monaco, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .widget-param-type {
      color: var(--text-dim);
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .widget-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-deep);
      color: var(--text);
      padding: 6px 8px;
    }
    .widget-nullable { color: var(--text-dim); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }

    .test-fullpage {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column;
      background: var(--bg); z-index: 100;
    }

    .test-fullpage,
    #testFullpage,
    [class*="comp-test-fullpage"] {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      overflow: auto;
    }

    .test-header {
      height: 48px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px;
      border-bottom: 1px solid var(--border); background: var(--bg-card);
      flex-shrink: 0;
    }

    .test-header .test-close-btn {
      background: none; border: none; color: var(--text);
      font-size: 14px; cursor: pointer; padding: 4px 12px;
      border-radius: 4px;
    }
    .test-header .test-close-btn:hover { background: var(--border); }

    .test-body {
      flex: 1; display: flex; overflow: hidden;
    }

    .test-input-panel {
      width: 50%; min-width: 320px; overflow-y: auto;
      padding: 16px; box-sizing: border-box;
    }

    .test-output-panel {
      flex: 1; min-width: 320px; overflow-y: auto;
      padding: 16px; box-sizing: border-box;
    }

    .test-divider {
      width: 6px; cursor: col-resize; background: var(--border);
      flex-shrink: 0; transition: background 0.2s;
    }
    .test-divider:hover { background: var(--primary); }

    .test-section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 12px;
      color: var(--text); padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .test-run-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-top: 1px solid var(--border);
      background: var(--bg-card); flex-shrink: 0;
    }

    .test-run-btn {
      padding: 8px 32px; background: var(--primary); color: #fff;
      border: none; border-radius: 6px; font-size: 15px;
      cursor: pointer; font-weight: 600;
    }
    .test-run-btn:hover { opacity: 0.9; }
    .test-run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .test-elapsed {
      font-size: 13px; color: var(--text-secondary);
    }

    .param-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 12px;
    }

    .param-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }

    .param-name {
      font-weight: 600; font-size: 14px; color: var(--text);
    }

    .param-type-badge {
      display: inline-block; font-size: 11px; padding: 2px 8px;
      border-radius: 4px; background: var(--primary); color: #fff;
      margin-left: 8px;
    }

    .param-desc {
      font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;
    }

    .param-skip-label {
      font-size: 12px; color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .param-skip-label input[type="checkbox"] { margin: 0; }

    .param-input-area { width: 100%; }

    .input-number, .input-text, .input-url {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px; background: var(--bg);
      color: var(--text); outline: none; box-sizing: border-box;
    }
    .input-number:focus, .input-text:focus, .input-url:focus {
      border-color: var(--primary);
    }

    .input-textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px; background: var(--bg);
      color: var(--text); outline: none; box-sizing: border-box;
      min-height: 100px; resize: vertical; font-family: inherit;
    }
    .input-textarea:focus { border-color: var(--primary); }

    .input-bool-group { display: flex; gap: 12px; }

    .input-bool-btn {
      padding: 6px 20px; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; font-size: 14px;
      background: var(--bg); color: var(--text);
    }
    .input-bool-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    .input-select {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px; background: var(--bg);
      color: var(--text); outline: none; box-sizing: border-box;
    }
    .input-select:focus { border-color: var(--primary); }

    .input-json-box {
      width: 100%; min-height: 120px; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 6px;
      font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
      background: var(--bg); color: var(--text); resize: vertical;
      box-sizing: border-box; outline: none;
    }
    .input-json-box:focus { border-color: var(--primary); }

    .json-toolbar {
      display: flex; gap: 8px; margin-top: 6px;
    }
    .json-toolbar-btn {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 10px; font-size: 12px; color: var(--text-secondary);
      cursor: pointer;
    }
    .json-toolbar-btn:hover { border-color: var(--primary); color: var(--primary); }

    .image-dropzone {
      min-height: 140px; border: 2px dashed var(--border);
      border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      padding: 24px 16px; transition: all 0.2s; box-sizing: border-box;
    }
    .image-dropzone:hover, .image-dropzone.drag-over {
      border-color: var(--primary); background: rgba(59,130,246,0.05);
    }

    .image-dropzone-text {
      font-size: 14px; color: var(--text-secondary); margin-top: 8px;
      text-align: center;
    }
    .image-dropzone-hint {
      font-size: 12px; color: var(--text-secondary); margin-top: 4px;
      opacity: 0.7;
    }

    .image-preview-container {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
    }

    .image-preview-item {
      position: relative; width: 100px; height: 100px;
      border-radius: 6px; overflow: hidden; border: 1px solid var(--border);
    }

    .image-preview-item img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .image-preview-remove {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,0.6); color: #fff;
      border: none; border-radius: 50%; width: 20px; height: 20px;
      font-size: 12px; cursor: pointer; line-height: 20px; text-align: center;
    }

    .image-file-info {
      font-size: 12px; color: var(--text-secondary); margin-top: 6px;
    }

    .image-mode-selector { display: flex; gap: 4px; margin-top: 8px; }

    .image-mode-btn {
      padding: 4px 12px; font-size: 12px; border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer; background: var(--bg);
      color: var(--text-secondary);
    }
    .image-mode-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    .file-upload-area {
      min-height: 100px; border: 2px dashed var(--border);
      border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      padding: 20px 16px; transition: all 0.2s; box-sizing: border-box;
    }
    .file-upload-area:hover, .file-upload-area.drag-over {
      border-color: var(--primary); background: rgba(59,130,246,0.05);
    }

    .file-info {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--bg); border-radius: 6px;
      margin-top: 8px; font-size: 13px; color: var(--text);
    }

    .file-info .file-remove-btn {
      background: none; border: none; color: #dc2626;
      cursor: pointer; font-size: 12px; margin-left: auto;
    }

    .file-preview-text {
      margin-top: 6px; padding: 8px; background: var(--bg);
      border-radius: 4px; font-family: monospace; font-size: 12px;
      max-height: 120px; overflow-y: auto; color: var(--text-secondary);
      white-space: pre-wrap; border: 1px solid var(--border);
    }

    .output-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .output-tab {
      padding: 8px 16px; cursor: pointer; font-size: 14px;
      border-bottom: 2px solid transparent; color: var(--text-secondary);
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .output-tab.active {
      color: var(--primary); border-bottom-color: var(--primary);
    }

    .output-content { min-height: 200px; }

    .output-text {
      font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-all;
      padding: 12px; background: var(--bg); border-radius: 6px;
      color: var(--text); border: 1px solid var(--border);
    }

    .output-error {
      font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-all;
      padding: 12px; background: #fef2f2; color: #dc2626;
      border: 1px solid #fecaca; border-radius: 6px;
    }

    .output-image {
      max-width: 100%; border-radius: 6px; cursor: pointer;
    }
    .output-image:hover { opacity: 0.9; }

    .output-images-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }

    .output-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .output-table th, .output-table td {
      padding: 8px 12px; border: 1px solid var(--border); text-align: left;
    }
    .output-table th {
      background: var(--bg-card); font-weight: 600; position: sticky; top: 0;
    }

    .output-json {
      font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-all;
      padding: 12px; background: var(--bg); border-radius: 6px;
      color: var(--text); border: 1px solid var(--border);
    }

    .output-section-label {
      font-size: 13px; font-weight: 600; color: var(--text);
      margin: 12px 0 6px 0;
    }

    .output-action-bar {
      display: flex; gap: 8px; margin: 8px 0;
    }
    .output-action-btn {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 12px; font-size: 12px; color: var(--text-secondary);
      cursor: pointer;
    }
    .output-action-btn:hover { border-color: var(--primary); color: var(--primary); }

    .output-download-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 16px; background: var(--primary); color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .output-download-btn:hover { opacity: 0.9; }

    .json-tree { font-family: monospace; font-size: 13px; line-height: 1.6; }
    .json-tree-key { color: #0451a5; cursor: pointer; }
    .json-tree-str { color: #a31515; }
    .json-tree-num { color: #098658; }
    .json-tree-bool { color: #0000ff; }
    .json-tree-null { color: #808080; }
    .json-tree-toggle {
      display: inline-block; width: 16px; text-align: center;
      cursor: pointer; color: var(--text-secondary); user-select: none;
    }
    .json-tree-children { padding-left: 20px; }
    .json-tree-children.collapsed { display: none; }

    .image-fullscreen-mask {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .image-fullscreen-mask img {
      max-width: 90vw; max-height: 90vh; border-radius: 8px;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding: 8px; }
      .brand { display: none; }
      .main { padding: 14px; }
      .statusbar { grid-column: 1; }
      .stat-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { flex-wrap: wrap; }
      .toolbar input, .toolbar select { max-width: none; flex: 1 1 180px; }
      .editor-main { grid-template-columns: 1fr; }
      .file-tree, .tree-resize { display: none; }
      .namespace-edit { width: 100%; }
      .log-filters { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }

    /* ====== 模板分块编辑器 ====== */
    .block-editor-container { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .block-editor-body { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .template-block { border: 1px solid var(--line); border-radius: 6px; overflow: visible; background: var(--bg-card); }
    .template-block.is-locked { border-left: 3px solid var(--warning); background: rgba(8, 18, 34, 0.92); }
    .template-block.is-locked .block-header { background: rgba(245, 166, 35, 0.08); border-bottom-color: rgba(245, 166, 35, 0.2); }
    .template-block.is-editable { border-left: 3px solid var(--accent); }
    .template-block.is-editable .block-header { background: rgba(0, 240, 200, 0.04); border-bottom-color: rgba(0, 240, 200, 0.10); }
    .template-block.is-editable:focus-within { box-shadow: 0 0 0 2px rgba(0, 240, 200, .15); }
    /* 紧凑单行 block 标题 */
    .block-header { display: flex; align-items: center; gap: 7px; padding: 3px 10px; background: var(--bg-card2); border-bottom: 1px solid var(--line); min-height: 30px; cursor: default; }
    .block-header .block-step-num { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .template-block.is-locked .block-step-num { background: var(--warning); color: #111; }
    .block-header .block-title-text { font-weight: 600; color: #fff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 160px; }
    .template-block.is-editable .block-title-text { color: var(--accent); }
    .block-header .block-title-text[contenteditable="true"] { outline: none; border-bottom: 1px dashed var(--accent); white-space: pre; max-width: 240px; color: #fff; }
    .block-header .block-lock-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(106,138,176,.15); color: var(--text-dim); flex-shrink: 0; }
    .template-block.is-locked .block-lock-badge { background: rgba(245,166,35,.15); color: var(--warning); }
    .template-block.is-editable .block-lock-badge { background: rgba(0,240,200,.1); color: var(--accent); }
    /* 内联描述预览（折叠状态） */
    .block-desc-preview { font-size: 11px; color: var(--text-dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .7; }
    /* 展开/折叠按钮 */
    .block-expand-btn { font-size: 11px; padding: 0 4px; color: var(--text-dim); background: none; border: 1px solid rgba(106,138,176,.2); border-radius: 3px; cursor: pointer; flex-shrink: 0; line-height: 18px; transition: transform .15s; }
    .block-expand-btn.expanded { transform: rotate(180deg); }
    .block-header .block-design-actions { display: flex; gap: 2px; margin-left: auto; flex-shrink: 0; }
    .block-header .block-design-actions button { font-size: 10px; padding: 1px 5px; border-radius: 3px; min-width: 0; position: relative; z-index: 2; }
    /* 折叠区 (desc + hint)，use mode 默认隐藏 */
    .block-meta { border-bottom: 1px solid rgba(106,138,176,.1); }
    .block-meta.collapsed { display: none; }
    .block-description { padding: 5px 12px; font-size: 12px; color: var(--text-dim); background: rgba(106,138,176,.04); border-bottom: 1px solid rgba(106,138,176,.06); }
    .block-description[contenteditable="true"] { outline: none; cursor: text; }
    .block-hint { padding: 4px 12px; font-size: 12px; color: #a78bfa; background: rgba(167,139,250,.06); }
    .block-hint[contenteditable="true"] { outline: none; cursor: text; }
    .block-code-area { min-height: 80px; overflow: hidden; }
    /* 插入区：默认 4px 间隙，hover 展开显示按钮 */
    .block-insert-zone { height: 4px; position: relative; transition: height .12s; }
    .block-insert-zone:hover { height: 28px; }
    .block-insert-zone .block-insert-btn { opacity: 0; height: 100%; transition: opacity .12s; }
    .block-insert-zone:hover .block-insert-btn { opacity: 1; }
    /* 底部悬浮添加按钮 */
    .block-add-row { padding: 6px 0 2px; text-align: right; }
    .block-editor-body::-webkit-scrollbar { width: 5px; }
    .block-editor-body::-webkit-scrollbar-track { background: transparent; }
    .block-editor-body::-webkit-scrollbar-thumb { background: rgba(106,138,176,.3); border-radius: 3px; }
    .block-editor-body::-webkit-scrollbar-thumb:hover { background: rgba(106,138,176,.5); }
    .block-insert-btn { display: flex; align-items: center; justify-content: center; padding: 4px; cursor: pointer; color: var(--text-dim); font-size: 12px; border-radius: 4px; border: 1px dashed transparent; transition: all .15s; }
    .block-insert-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,240,200,.04); }
    .block-flash { animation: blockFlash 1.2s ease; }
    @keyframes blockFlash {
      0%, 100% { box-shadow: none; }
      20%, 60% { box-shadow: inset 0 0 0 2px var(--accent), 0 0 12px rgba(0, 240, 200, 0.2); }
    }
    .locked-line-decoration { background: rgba(106,138,176,.08) !important; }
    .locked-glyph { background: var(--text-dim); width: 3px !important; margin-left: 3px; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="loginPage" style="position:fixed;inset:0;z-index:9999;background:var(--bg-deep);align-items:center;justify-content:center;display:none">
    <div style="width:340px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:36px 32px;box-shadow:var(--shadow)">
      <div style="font-size:20px;font-weight:700;margin-bottom:6px;color:#fff">AlgoLib 管理平台</div>
      <div style="color:var(--text-dim);font-size:13px;margin-bottom:24px">请登录以继续</div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:13px;margin-bottom:5px;color:var(--text-dim)">用户名</label>
        <input id="loginUsername" type="text" placeholder="admin" autocomplete="username" />
      </div>
      <div style="margin-bottom:20px">
        <label style="display:block;font-size:13px;margin-bottom:5px;color:var(--text-dim)">密码</label>
        <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" />
      </div>
      <div id="loginError" style="display:none;color:var(--danger);font-size:13px;margin-bottom:12px"></div>
      <button class="primary" style="width:100%" onclick="window.doLogin()">登 录</button>
    </div>
  </div>
  <div class="app" id="appShell" style="display:none">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <div class="statusbar" id="statusbar">
      <span id="conn">● AlgoLib 已连接</span>
      <span id="clock"></span>

    const WIDGET_ZH = {
      int: "整数", float: "小数", str: "文本", text: "长文本",
      bool: "布尔", list: "列表", dict: "字典", json: "JSON",
      dataframe: "表格数据", image: "图片", images: "多张图片",
      file: "文件", audio: "音频", video: "视频", url: "网址",
