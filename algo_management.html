<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlgoLib 算法管理平台</title>
  <style>
    :root {
      --bg-deep: #060f1e;
      --bg-nav: #081528;
      --bg-card: #0c1e38;
      --bg-card2: #0f2448;
      --primary: #1e90ff;
      --accent: #00f0c8;
      --success: #00c48c;
      --warning: #f5a623;
      --danger: #ff4d6a;
      --snippet: #a855f7;
      --text: #c8d8f0;
      --text-dim: #6a8ab0;
      --line: rgba(106, 138, 176, .28);
      --shadow: 0 18px 50px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg-deep);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--bg-card2);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    button:hover { border-color: var(--primary); color: #fff; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button.primary { border-color: transparent; background: var(--primary); color: #fff; }
    button.success { border-color: rgba(0, 196, 140, .45); background: rgba(0, 196, 140, .16); color: var(--success); }
    button.danger { border-color: rgba(255, 77, 106, .45); background: rgba(255, 77, 106, .14); color: #ffb7c4; }
    button.ghost { background: transparent; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #07162b;
      color: var(--text);
      border-radius: 6px;
      padding: 9px 10px;
      outline: none;
    }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 168px 1fr;
      grid-template-rows: 1fr 28px;
      background: var(--bg-deep);
    }
    .sidebar {
      grid-row: 1;
      background: var(--bg-nav);
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      overflow: auto;
    }
    .brand {
      margin: 4px 8px 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .brand span { color: var(--accent); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      padding: 9px 10px;
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(30, 144, 255, .14);
      color: #fff;
    }
    .nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 14px var(--primary);
    }
    .main {
      grid-row: 1;
      min-width: 0;
      overflow: auto;
      padding: 20px 24px 34px;
    }
    .statusbar {
      grid-column: 1 / 3;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 12px;
      background: #041022;
      border-top: 1px solid var(--line);
      color: var(--text-dim);
      font-size: 12px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      color: #fff;
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar input { max-width: 250px; }
    .toolbar select { max-width: 145px; }
    .toolbar button { min-width: 72px; padding: 8px 10px; }
    .toolbar-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .new-workspace {
      min-height: calc(100vh - 84px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
    }
    .new-form-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }
    .new-form-grid label { display: grid; gap: 4px; color: var(--text-dim); font-size: 12px; }
    .new-form-grid .wide { grid-column: span 2; }
    .new-form-grid .full { grid-column: 1 / -1; }
    .file-editor-grid {
      min-height: 420px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 10px;
    }
    .file-list-panel {
      background: #07162b;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
    }
    .file-list-panel button {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(106, 138, 176, .14);
      border-radius: 0;
      text-align: left;
    }
    .file-list-panel button.active { color: #fff; background: rgba(30, 144, 255, .18); }
    .file-edit-area {
      min-height: 420px;
      font: 13px/1.5 Consolas, "Courier New", monospace;
    }
    .workspace-monaco {
      min-height: 460px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #040e1f;
    }
    .draft-badge {
      color: var(--warning);
      border: 1px solid rgba(245, 166, 35, .38);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
    }
    .spacer { flex: 1; }
    .stat-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }
    .stat-label { color: var(--text-dim); font-size: 12px; }
    .stat-value { margin-top: 3px; color: #fff; font-size: 24px; font-weight: 700; }

    .folder-section {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 10px;
    }
    .folder-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .folder-head h3 { margin: 0; color: #fff; font-size: 15px; }
    .folder-head .count { color: var(--text-dim); }
    .folder-body {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
    }
    .folder-section.collapsed .folder-body { display: none; }
    .folder-section.collapsed .folder-toggle { transform: rotate(-90deg); }
    .folder-toggle { width: 32px; padding: 6px 0; transition: transform .16s ease; }

    .algo-card {
      min-height: 142px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 12px 14px;
      position: relative;
    }
    .algo-card.template { border-left-color: var(--success); }
    .algo-card.snippet { border-left-color: var(--snippet); }
    .algo-card.highlight { animation: highlight 2s ease; }
    @keyframes highlight {
      0%, 100% { box-shadow: none; }
      20%, 70% { box-shadow: 0 0 0 2px var(--accent), 0 0 26px rgba(0, 240, 200, .28); }
    }
    .card-title { color: #fff; font-size: 15px; font-weight: 700; padding-right: 86px; }
    .card-ns {
      color: var(--accent);
      font: 12px/1.4 Consolas, "Courier New", monospace;
      word-break: break-all;
    }
    .desc {
      color: var(--text-dim);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .tag.success { color: var(--success); border-color: rgba(0, 196, 140, .42); }
    .tag.warning { color: var(--warning); border-color: rgba(245, 166, 35, .42); }
    .tag.danger { color: var(--danger); border-color: rgba(255, 77, 106, .42); }
    .status-badge { position: absolute; top: 10px; right: 12px; background: rgba(7, 22, 43, .92); cursor: default; }
    .status-badge[onclick] { cursor: pointer; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .card-actions button { padding: 6px 10px; }

    .skeleton {
      height: 172px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--bg-card), var(--bg-card2), var(--bg-card));
      background-size: 240% 100%;
      animation: shine 1.1s infinite;
    }
    @keyframes shine { to { background-position: -240% 0; } }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 28px;
      text-align: center;
      color: var(--text-dim);
    }

    .editor-view {
      height: calc(100vh - 82px);
      min-height: 560px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      background: #040e1f;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .editor-top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .breadcrumb { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .namespace-edit { width: min(360px, 30vw); }
    .editor-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .editor-actions button { min-width: 70px; padding: 8px 10px; }
    .namespace-edit.invalid input { border-color: var(--danger); }
    .field-error { min-height: 16px; color: var(--danger); font-size: 12px; }
    .editor-main {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--tree-width, 232px) 5px 1fr;
    }
    .file-tree {
      min-width: 120px;
      max-width: 320px;
      overflow: auto;
      background: #07162b;
      border-right: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .file-tree-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid rgba(106, 138, 176, .16);
      color: var(--text-dim);
      font-size: 12px;
    }
    .file-item {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(106, 138, 176, .12);
      cursor: pointer;
    }
    .file-item.active { background: rgba(30, 144, 255, .18); color: #fff; }
    .file-name { font-family: Consolas, "Courier New", monospace; }
    .file-functions { margin-top: 3px; color: var(--text-dim); font-size: 12px; }
    .tree-resize { background: #0b1d38; cursor: col-resize; }
    .monaco-host { min-width: 0; min-height: 0; }
    .v-resize-bar {
      height: 8px;
      background: #0b1d38;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: row-resize;
    }
    .test-panel {
      height: 0;
      overflow: auto;
      background: var(--bg-card);
      padding: 0 12px;
    }
    .test-panel.open { padding: 12px; }
    .param-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .param-field label { display: block; margin-bottom: 4px; color: var(--text-dim); font-size: 12px; }
    .control-row, .tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
    }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }
    .output {
      min-height: 120px;
      max-height: 260px;
      overflow: auto;
      background: #07162b;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
    }
    .output pre { margin: 0; white-space: pre-wrap; }
    .heatmap { display: grid; gap: 2px; align-items: stretch; }
    .heatcell { min-height: 22px; min-width: 28px; border-radius: 2px; }
    .linechart { width: 100%; height: 180px; }
    .kv-table, .data-table, .api-table {
      width: 100%;
      border-collapse: collapse;
    }
    .kv-table th, .kv-table td, .data-table th, .data-table td, .api-table th, .api-table td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .api-tabs { display: flex; gap: 8px; margin: 0 0 14px; }
    .api-tabs button.active { border-color: var(--accent); color: var(--accent); }
    .bar-row {
      display: grid;
      grid-template-columns: 190px 1fr 58px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }
    .bar {
      height: 14px;
      overflow: hidden;
      background: rgba(30, 144, 255, .18);
      border-radius: 4px;
    }
    .bar span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .log-filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .toast {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 60;
      max-width: min(520px, calc(100vw - 36px));
      background: #092542;
      border: 1px solid rgba(0, 240, 200, .45);
      border-radius: 6px;
      box-shadow: var(--shadow);
      padding: 10px 14px;
      color: #fff;
    }
    .hidden { display: none !important; }
    .overlay, .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 18, .74);
      z-index: 50;
    }
    .overlay {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
    }
    .overlay-card, .modal {
      width: min(720px, calc(100vw - 28px));
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .snippet-result {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .snippet-result:hover, .snippet-result.active { background: rgba(30, 144, 255, .14); }
    .snippet-preview { color: var(--text-dim); font: 12px Consolas, "Courier New", monospace; }
    .modal-backdrop {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal h3 { margin: 0 0 12px; color: #fff; }
    .form-grid { display: grid; gap: 10px; }
    .form-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; }
    .form-row label { padding-top: 9px; color: var(--text-dim); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .invalid-field { border-color: var(--danger) !important; }

    .scope-badge {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(7, 22, 43, .92);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      cursor: default;
    }
    .scope-badge.scope-team { color: var(--accent); border: 1px solid rgba(0, 240, 200, .42); }
    .scope-badge.scope-private { color: var(--text-dim); border: 1px solid var(--line); }

    .nav-sub { overflow: hidden; transition: max-height .2s ease; max-height: 400px; }
    .nav-sub.collapsed { max-height: 0; }
    .nav-sub-item {
      display: flex;
      align-items: center;
      padding: 6px 10px 6px 26px;
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .nav-sub-item:hover, .nav-sub-item.active { background: rgba(30, 144, 255, .12); color: #fff; }
    .nav-toggle { background: none; border: none; color: var(--text-dim); padding: 0 4px; font-size: 11px; transition: transform .18s; }
    .nav-item.has-sub { margin-bottom: 0; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding: 8px; }
      .brand { display: none; }
      .main { padding: 14px; }
      .statusbar { grid-column: 1; }
      .stat-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { flex-wrap: wrap; }
      .toolbar input, .toolbar select { max-width: none; flex: 1 1 180px; }
      .editor-main { grid-template-columns: 1fr; }
      .file-tree, .tree-resize { display: none; }
      .namespace-edit { width: 100%; }
      .log-filters { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" style="position:fixed;inset:0;z-index:9999;background:var(--bg-deep);align-items:center;justify-content:center;display:none">
    <div style="width:340px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:36px 32px;box-shadow:var(--shadow)">
      <div style="font-size:20px;font-weight:700;margin-bottom:6px;color:#fff">AlgoLib 管理平台</div>
      <div style="color:var(--text-dim);font-size:13px;margin-bottom:24px">请登录以继续</div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:13px;margin-bottom:5px;color:var(--text-dim)">用户名</label>
        <input id="loginUsername" type="text" placeholder="admin" autocomplete="username" />
      </div>
      <div style="margin-bottom:20px">
        <label style="display:block;font-size:13px;margin-bottom:5px;color:var(--text-dim)">密码</label>
        <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" />
      </div>
      <div id="loginError" style="display:none;color:var(--danger);font-size:13px;margin-bottom:12px"></div>
      <button class="primary" style="width:100%" onclick="window.doLogin()">登 录</button>
    </div>
  </div>
  <div class="app" id="appShell" style="display:none">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <div class="statusbar" id="statusbar">
      <span id="conn">● AlgoLib 已连接</span>
      <span id="clock"></span>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="snippetOverlay" class="overlay snippet-search-overlay hidden"></div>
  <div id="modalRoot" class="modal-backdrop hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    const BASE = window._ALGO_BASE || "http://127.0.0.1:8000";
    window._activeMonaco = null;

    const state = {
      page: "components",
      currentUser: null,
      data: { components: [], templates: [], snippets: [] },
      categories: { components: [], templates: [] },
      filters: {},
      editing: null,
      monacoReady: null,
      monaco: null,
      models: new Map(),
      fileMeta: new Map(),
      viewStates: new Map(),
      currentFile: "",
      testHeight: 0,
      outputMode: "json",
      lastRunResult: null,
      completionDisposable: null,
      completionItems: [],
      highlightId: "",
      apiTab: "keys",
      monitorPeriod: "24h",
      logsPage: 1,
      snippetResults: [],
      snippetCursor: 0,
      workspaceEditor: null,
      workspaceModels: new Map(),
      sse: null,
      navSubExpanded: { components: true, templates: false },
      navFilter: ""
    };

    function qs(selector, root = document) { return root.querySelector(selector); }
    function qsa(selector, root = document) { return Array.from(root.querySelectorAll(selector)); }
    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
    function normalizeListPayload(data, key) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data[key])) return data[key];
      if (Array.isArray(data.items)) return data.items;
      return [];
    }
    function showToast(message) {
      const el = qs("#toast");
      el.textContent = message;
      el.classList.remove("hidden");
      window.clearTimeout(showToast._timer);
      showToast._timer = window.setTimeout(() => el.classList.add("hidden"), 2600);
    }
    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
      const token = localStorage.getItem("algolib_token");
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const response = await fetch(BASE + path, { ...options, headers });
      let data = null;
      try { data = await response.json(); } catch (error) { data = { detail: response.statusText }; }
      if (response.status === 401) {
        localStorage.removeItem("algolib_token");
        localStorage.removeItem("algolib_user");
        state.currentUser = null;
        showLoginPage();
        throw new Error("登录已过期，请重新登录");
      }
      if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
      return data;
    }
    function pageTitle(page) {
      return {
        components: "算法组件",
        templates: "算法模板",
        snippets: "代码片段",
        api: "API 管理",
        monitor: "调用监控",
        logs: "运行日志",
        settings: "系统设置"
      }[page] || page;
    }
    function getName(item) { return item.zhName || item.zh_name || item.name || item.funcName || item.id || "未命名"; }
    function getDesc(item) { return item.zhDescription || item.zh_description || item.description || item.body || "暂无描述"; }
    function getTags(item) { return item.zhTags || item.zh_tags || item.tags || []; }
    function getStatus(item) { return item.publishStatus || item.publish_status || item.lifecycleStatus || (item.published ? "published" : "draft"); }
    function getNs(item, page) {
      if (page === "snippets") return item.name || "";
      return item.callPrefix || item.displayNamespace || "";
    }
    function namespacePrefix(item) {
      return `alg.${item.namespace || ""}.`;
    }
    function namespaceFunction(item) {
      return item.funcName || String(item.callPrefix || item.displayNamespace || "").split(".").pop() || "";
    }
    function groupKey(item, page) {
      if (page === "snippets") return (item.tags && item.tags[0]) || item.scope || "default";
      return String(item.namespace || "default").split(".")[0] || "default";
    }
    function categoryLabel(namespace, page) {
      const category = (state.categories[page] || []).find(item => item.namespace === namespace);
      return category ? (category.zh_name || category.namespace) : namespace;
    }
    function statusClass(status) {
      if (status === "published" || status === "approved") return "success";
      if (status === "reviewing") return "warning";
      if (status === "rejected" || status === "deprecated") return "danger";
      return "";
    }
    function statusLabel(status) {
      return {
        published: "应用中",
        approved: "已通过",
        reviewing: "审核中",
        rejected: "审核未通过",
        draft: "草稿",
        deprecated: "已下架"
      }[status] || status;
    }
    function parseVersion(value) {
      const parts = String(value || "1.0.0").split(".").map(part => Number.parseInt(part, 10) || 0);
      return [parts[0] || 0, parts[1] || 0, parts[2] || 0];
    }
    function versionUpgradeOptions(current) {
      const [major, minor, patch] = parseVersion(current);
      return [
        { value: `${major}.${minor}.${patch + 1}`, label: `补丁版本：${current || "1.0.0"} → ${major}.${minor}.${patch + 1}` },
        { value: `${major}.${minor + 1}.0`, label: `小版本：${current || "1.0.0"} → ${major}.${minor + 1}.0` },
        { value: `${major + 1}.0.0`, label: `大版本：${current || "1.0.0"} → ${major + 1}.0.0` }
      ];
    }
    function localDraftKey(id, filename) {
      return `algolib_draft_${id}_${filename || "source"}`;
    }
    function loadLocalDraft(id, filename, fallback) {
      const value = localStorage.getItem(localDraftKey(id, filename));
      return value == null ? fallback : value;
    }
    function saveLocalDraft(id, filename, content) {
      localStorage.setItem(localDraftKey(id, filename), content);
    }
    function removeLocalDraft(id, filename) {
      localStorage.removeItem(localDraftKey(id, filename));
    }
    function hasLocalDraft(id, filename) {
      return localStorage.getItem(localDraftKey(id, filename)) != null;
    }
    function parsePythonFunctions(source) {
      const functions = [];
      const re = /^def\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(([^)]*)\)\s*(?:->\s*([^:]+))?:/gm;
      let match;
      while ((match = re.exec(source || ""))) {
        const params = match[2].split(",").map(raw => raw.trim()).filter(Boolean).filter(raw => !["self", "cls"].includes(raw.split(":")[0].trim())).map(raw => {
          const withoutDefault = raw.split("=")[0].trim();
          const [name, annotation] = withoutDefault.split(":").map(part => part.trim());
          return { name, type: annotation || "str", annotation: annotation || "str" };
        });
        functions.push({ func_name: match[1], name: match[1], params, return_type: (match[3] || "").trim() });
      }
      return functions;
    }
    function updateModelDiagnostics(model) {
      if (!state.monaco || !model) return;
      const markers = [];
      const lines = model.getValue().split("\n");
      lines.forEach((line, index) => {
        const lineNumber = index + 1;
        if (/^\t+/.test(line)) {
          markers.push({ severity: state.monaco.MarkerSeverity.Warning, message: "建议使用 4 个空格缩进，不使用 Tab", startLineNumber: lineNumber, startColumn: 1, endLineNumber: lineNumber, endColumn: 2 });
        }
        const leading = (line.match(/^ +/) || [""])[0].length;
        if (leading && leading % 4 !== 0) {
          markers.push({ severity: state.monaco.MarkerSeverity.Warning, message: "缩进不是 4 的倍数", startLineNumber: lineNumber, startColumn: 1, endLineNumber: lineNumber, endColumn: leading + 1 });
        }
      });
      state.monaco.editor.setModelMarkers(model, "algolib-style", markers);
    }
    function refreshCurrentFileFunctions() {
      const model = state.models.get(state.currentFile);
      const meta = state.fileMeta.get(state.currentFile);
      if (!model || !meta) return;
      meta.functions = normalizeFunctions(parsePythonFunctions(model.getValue()));
      updateModelDiagnostics(model);
      renderTestPanel();
      renderFileTree();
    }
    function paramKind(type) {
      const text = String(type || "").toLowerCase().replace(/\s+/g, "");
      if (text.includes("dataframe")) return "dataframe";
      if (text.startsWith("list") || text.startsWith("tuple") || text.startsWith("set") || /\[\s*\]/.test(text)) return "list";
      if (text.startsWith("dict") || text.includes("mapping")) return "dict";
      if (text.includes("bool")) return "bool";
      if (text.includes("int")) return "int";
      if (text.includes("float") || text.includes("number")) return "float";
      return "str";
    }
    function safeId(id) { return encodeURIComponent(id); }
    function currentModuleKind(page) {
      if (page === "components") return "component";
      if (page === "templates") return "template";
      return "snippet";
    }

    function renderNav() {
      function renderSubNav(page) {
        const cats = state.categories[page] || [];
        if (!cats.length) return "";
        const expanded = state.navSubExpanded[page] !== false;
        return `<div class="nav-sub${expanded ? "" : " collapsed"}" id="navSub_${page}">${
          cats.map(cat => {
            const ns = cat.namespace;
            const active = state.page === page && state.navFilter === ns;
            return `<div class="nav-sub-item${active ? " active" : ""}" onclick="window.switchPageAndFilter('${esc(page)}','${esc(ns)}')">${esc(cat.zh_name || ns)}</div>`;
          }).join("")
        }</div>`;
      }
      const pages = [
        ["components", "算法组件"],
        ["templates", "算法模板"],
        ["snippets", "代码片段"],
        ["review", "算法审核"],
        ["api", "API 管理"],
        ["monitor", "调用监控"],
        ["logs", "运行日志"],
        ["settings", "系统设置"],
        ...(state.currentUser && state.currentUser.role === "admin" ? [["users", "用户管理"]] : [])
      ];
      const hasSub = ["components", "templates"];
      qs("#sidebar").innerHTML = [
        '<div class="brand">Algo<span>Lib</span> 管理平台</div>',
        ...pages.map(([page, label]) => {
          const isActive = page === state.page;
          const withSub = hasSub.includes(page);
          const expanded = state.navSubExpanded[page] !== false;
          return `<div class="nav-item${isActive ? " active" : ""}${withSub ? " has-sub" : ""}" data-page="${page}">
            <span class="nav-dot"></span>${label}
            ${withSub ? `<button class="nav-toggle" onclick="event.stopPropagation();window.toggleNavSub('${page}')">${expanded ? "▾" : "▸"}</button>` : ""}
          </div>
          ${withSub ? renderSubNav(page) : ""}`;
        }),
        state.currentUser ? `<div style="margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--text-dim)">
          <div style="color:var(--text);font-weight:600">${esc(state.currentUser.display_name || state.currentUser.username)}</div>
          <div style="margin:2px 0 6px">${esc(state.currentUser.role === "admin" ? "管理员" : "普通用户")}</div>
          <button class="ghost" style="font-size:12px;padding:4px 8px" onclick="window.doLogout()">退出登录</button>
        </div>` : ""
      ].join("");
      qsa(".nav-item").forEach(item => {
        item.addEventListener("click", () => switchPage(item.dataset.page));
      });
    }

    function toggleNavSub(page) {
      state.navSubExpanded[page] = !state.navSubExpanded[page];
      const sub = qs(`#navSub_${page}`);
      const btn = qs(`.nav-item[data-page="${page}"] .nav-toggle`);
      if (sub) sub.classList.toggle("collapsed", !state.navSubExpanded[page]);
      if (btn) btn.textContent = state.navSubExpanded[page] ? "▾" : "▸";
    }

    function switchPageAndFilter(page, namespace) {
      state.navFilter = namespace;
      switchPage(page);
    }

    function switchPage(page) {
      state.page = page;
      qsa(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.page === page));
      renderPage(page);
    }

    function renderPage(page) {
      if (page === "components" || page === "templates" || page === "snippets") {
        renderModulePage(page);
        return;
      }
      if (page === "api") {
        renderApiPage();
        return;
      }
      if (page === "review") {
        renderReviewPage();
        return;
      }
      if (page === "monitor") {
        renderMonitorPage(false);
        return;
      }
      if (page === "logs") {
        renderLogsPage();
        return;
      }
      if (page === "users") {
        renderUsersPage();
        return;
      }
      renderSettingsPage();
    }

    function skeletonHtml() {
      return `<div class="folder-body">${Array.from({ length: 8 }, () => '<div class="skeleton"></div>').join("")}</div>`;
    }

    async function loadModuleData(page) {
      if (page === "snippets") {
        const data = await api("/api/v1/snippets");
        state.data.snippets = normalizeListPayload(data, "snippets");
        return state.data.snippets;
      }
      const [data, categoryData] = await Promise.all([
        api(`/api/v1/algorithms?module_kind=${currentModuleKind(page)}`),
        api(`/api/v1/categories?module_kind=${currentModuleKind(page)}`)
      ]);
      state.data[page] = normalizeListPayload(data, "algorithms");
      state.categories[page] = normalizeListPayload(categoryData, "categories");
      return state.data[page];
    }

    function renderModulePage(page) {
      qs("#main").innerHTML = `
        <h1>${pageTitle(page)}</h1>
        <div class="toolbar">
          <input id="filterSearch" placeholder="搜索名称、命名空间、描述、标签" oninput="window.applyFilters()" />
          <select id="filterCategory" onchange="window.applyFilters()"><option value="">全部分类</option></select>
          <select id="filterLanguage" onchange="window.applyFilters()"><option value="">全部语言</option></select>
          ${page === "components" ? '<select id="filterStatus" onchange="window.applyFilters()"><option value="">全部状态</option></select>' : ""}
          ${page === "snippets" ? '<select id="filterScope" onchange="window.applyFilters()"><option value="">全部权限</option><option value="private">私有</option><option value="team">共享</option></select>' : ""}
          <button onclick="window.applyFilters()">筛选</button>
          <span class="spacer"></span>
          <div class="toolbar-actions">
            ${(page === "components" || page === "templates") ? `<button onclick="window.createRootCategory('${page}')">新建分类</button>` : ""}
            <button class="primary" onclick="window.createNew('${page}')">新建</button>
          </div>
        </div>
        <section id="stats" class="stat-bar"></section>
        <section id="list">${skeletonHtml()}</section>
      `;
      loadModuleData(page).then(() => {
        renderNav();
        hydrateFilters(page);
        if (state.navFilter) {
          const sel = qs("#filterCategory");
          if (sel) sel.value = state.navFilter;
        }
        renderCards(page);
      }).catch(error => {
        qs("#list").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
      });
    }

    function hydrateFilters(page) {
      const items = state.data[page] || [];
      const knownCategories = (state.categories[page] || []).map(item => item.namespace).filter(Boolean);
      const categories = [...new Set([...knownCategories, ...items.map(item => groupKey(item, page))])].filter(Boolean).sort();
      const languages = [...new Set(items.map(item => item.language || "python"))].filter(Boolean).sort();
      qs("#filterCategory").innerHTML = '<option value="">全部分类</option>' + categories.map(value => `<option value="${esc(value)}">${esc(categoryLabel(value, page))}</option>`).join("");
      qs("#filterLanguage").innerHTML = '<option value="">全部语言</option>' + languages.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join("");
      const status = qs("#filterStatus");
      if (status) {
        const statuses = [...new Set(items.map(getStatus))].filter(Boolean).sort();
        status.innerHTML = '<option value="">全部状态</option>' + statuses.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join("");
      }
    }

    function filteredItems(page) {
      const q = (qs("#filterSearch")?.value || "").trim().toLowerCase();
      const category = qs("#filterCategory")?.value || "";
      const language = qs("#filterLanguage")?.value || "";
      const status = qs("#filterStatus")?.value || "";
      const scope = qs("#filterScope")?.value || "";
      return (state.data[page] || []).filter(item => {
        const text = [getName(item), getNs(item, page), getDesc(item), ...(getTags(item) || [])].join(" ").toLowerCase();
        return (!q || text.includes(q))
          && (!category || groupKey(item, page) === category)
          && (!language || (item.language || "python") === language)
          && (!status || getStatus(item) === status)
          && (!scope || item.scope === scope);
      });
    }

    function renderStats(page, items) {
      const categoryCount = new Set(items.map(item => groupKey(item, page))).size;
      const languageCount = new Set(items.map(item => item.language || "python")).size;
      const todayCount = items.filter(item => {
        const time = item.updated_at || item.created_at || item.updatedAt || "";
        return String(time).slice(0, 10) === new Date().toISOString().slice(0, 10);
      }).length;
      const fourthLabel = page === "components" ? "待审核" : page === "snippets" ? "共享片段" : "可发布";
      const fourthValue = page === "components"
        ? items.filter(item => getStatus(item) === "reviewing").length
        : page === "snippets"
          ? items.filter(item => item.scope === "team").length
          : items.length;
      qs("#stats").innerHTML = [
        ["总数", items.length],
        ["分类数", categoryCount],
        ["今日更新", todayCount],
        [fourthLabel, fourthValue || languageCount]
      ].map(([label, value]) => `<article class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></article>`).join("");
    }

    function renderCards(page) {
      const items = filteredItems(page);
      renderStats(page, items);
      const categoryKeys = page === "snippets" ? [] : (state.categories[page] || []).map(item => item.namespace).filter(Boolean);
      const groups = items.reduce((acc, item) => {
        const key = groupKey(item, page);
        if (!acc[key]) acc[key] = [];
        acc[key].push(item);
        return acc;
      }, categoryKeys.reduce((acc, key) => ({ ...acc, [key]: [] }), {}));
      qs("#list").innerHTML = Object.keys(groups).sort().map(key => `
        <section class="folder-section">
          <div class="folder-head">
            <button class="ghost folder-toggle" onclick="window.toggleFolder(this)">▾</button>
            <h3>${esc(categoryLabel(key, page))}</h3>
            <span class="count">${groups[key].length}</span>
            <span class="spacer"></span>
            <button class="ghost" onclick="window.editCategory('${esc(key)}','${esc(page)}')">编辑分类</button>
            <button class="ghost" onclick="window.createSubcategory('${esc(key)}','${esc(page)}')">新建子分类</button>
          </div>
          <div class="folder-body">${groups[key].map(item => renderCard(item, page)).join("")}</div>
        </section>
      `).join("") || '<div class="empty">暂无数据</div>';
    }

    function renderCard(item, page) {
      const kind = page === "templates" ? "template" : page === "snippets" ? "snippet" : "";
      const status = getStatus(item);
      const id = item.id;
      const buttons = page === "components"
        ? `<button onclick="window.openEditorById('${esc(id)}','components')">编辑</button>
           <button onclick="window.openEditorById('${esc(id)}','components',true)">测试</button>
           <button onclick="window.editAlgorithmInfo('${esc(id)}','components')">基本信息</button>
           <button onclick="window.showApiDoc('${esc(id)}')">查看 API 文档</button>
           ${status === "draft" ? `<button onclick="window.submitReview('${esc(id)}')">提交审核</button>` : ""}
           ${status === "reviewing" ? `<button onclick="window.withdrawReview('${esc(id)}')">撤回</button>` : ""}
           ${status === "approved" ? `<button class="success" onclick="window.publishComponent('${esc(id)}')">正式发布</button>` : ""}
           ${status === "published" ? `<button onclick="window.deprecateComponent('${esc(id)}')">下架</button>` : ""}
           ${status !== "published" ? `<button class="danger" onclick="window.deleteAlgorithm('${esc(id)}')">删除</button>` : ""}`
        : page === "templates"
          ? `<button onclick="window.openEditorById('${esc(id)}','templates')">编辑</button>
             <button onclick="window.editAlgorithmInfo('${esc(id)}','templates')">基本信息</button>
             <button class="primary" onclick="window.publishAsComponent('${esc(id)}',this)">发布为组件</button>
             <button class="danger" onclick="window.deleteAlgorithm('${esc(id)}')">删除</button>`
          : `<button onclick="window.editSnippet('${esc(id)}')">编辑</button>
             <button onclick="window.insertSnippetById('${esc(id)}')">插入/复制</button>
             <button class="danger" onclick="window.deleteSnippet('${esc(id)}')">删除</button>`;
      const visibleTags = (getTags(item) || []).filter(tag => !["多文件", "复杂算法"].includes(String(tag))).slice(0, 2);
      return `
        <article class="algo-card ${kind} ${state.highlightId === id ? "highlight" : ""}" data-id="${esc(id)}">
          ${(page === "components" || page === "templates") ? `<span class="tag ${statusClass(status)} status-badge" ${status === "rejected" ? `onclick="window.showReviewDraft('${esc(id)}')" title="查看被驳回的修改内容"` : ""}>${esc(statusLabel(status))}</span>` : ""}
          <div class="card-title">${esc(getName(item))}</div>
          <div class="card-ns">${esc(getNs(item, page))}</div>
          <div class="desc">${esc(getDesc(item))}</div>
          <div class="tags">
            <span class="tag">${esc(item.language || "python")}</span>
            <span class="tag">v${esc(item.version || "1.0")}</span>
            ${page === "snippets" ? `<span class="tag scope-badge ${item.scope === 'team' ? 'scope-team' : 'scope-private'}">${item.scope === 'team' ? '共享' : '私有'}</span>` : ""}
            ${visibleTags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("")}
          </div>
          <div class="card-actions">${buttons}</div>
        </article>
      `;
    }

    function applyFilters() { renderCards(state.page); }
    function toggleFolder(button) { button.closest(".folder-section").classList.toggle("collapsed"); }

    function editCategory(namespace, page) {
      const category = (state.categories[page] || []).find(item => item.namespace === namespace) || { namespace, zh_name: namespace };
      qs("#modalRoot").classList.remove("hidden");
      qs("#modalRoot").innerHTML = `
        <div class="modal">
          <h3>编辑分类</h3>
          <div class="form-grid">
            <div class="form-row"><label>中文文件夹名</label><input id="catZhName" value="${esc(category.zh_name || namespace)}" /></div>
            <div class="form-row"><label>命名空间</label><input id="catNamespace" value="${esc(category.namespace || namespace)}" /></div>
          </div>
          <div class="field-error" id="catErr"></div>
          <div class="modal-actions">
            <button onclick="window.closeModal()">取消</button>
            <button class="primary" onclick="window.saveCategory('${esc(namespace)}','${esc(page)}')">保存</button>
          </div>
        </div>
      `;
    }

    async function saveCategory(namespace, page) {
      const newNamespace = qs("#catNamespace").value.trim();
      if (!/^[a-z_][a-z0-9_]*(?:\.[a-z_][a-z0-9_]*)*$/.test(newNamespace)) {
        qs("#catErr").textContent = "命名空间只能使用小写字母、数字和下划线，可用点号分级";
        return;
      }
      try {
        await api(`/api/v1/categories/${safeId(namespace)}?module_kind=${currentModuleKind(page)}`, {
          method: "PATCH",
          body: JSON.stringify({ zh_name: qs("#catZhName").value.trim(), new_namespace: newNamespace })
        });
        closeModal();
        showToast("分类已更新");
        await loadModuleData(page);
        renderCards(page);
      } catch (error) {
        qs("#catErr").textContent = error.message;
      }
    }

    function createSubcategory(namespace, page) {
      qs("#modalRoot").classList.remove("hidden");
      qs("#modalRoot").innerHTML = `
        <div class="modal">
          <h3>新建子分类</h3>
          <div class="form-grid">
            <div class="form-row"><label>父级分类</label><input value="${esc(categoryLabel(namespace, page))}" disabled /></div>
            <div class="form-row"><label>子分类命名空间</label><input id="subName" placeholder="例如 feature_engineering" /></div>
            <div class="form-row"><label>中文文件夹名</label><input id="subZhName" placeholder="例如 特征工程" /></div>
          </div>
          <div class="field-error" id="subErr"></div>
          <div class="modal-actions">
            <button onclick="window.closeModal()">取消</button>
            <button class="primary" onclick="window.saveSubcategory('${esc(namespace)}','${esc(page)}')">创建</button>
          </div>
        </div>
      `;
    }

    async function saveSubcategory(namespace, page) {
      const name = qs("#subName").value.trim();
      if (!/^[a-z_][a-z0-9_]*$/.test(name)) {
        qs("#subErr").textContent = "子分类命名空间只能使用小写字母、数字和下划线";
        return;
      }
      try {
        await api(`/api/v1/categories/${safeId(namespace)}/subcategories`, {
          method: "POST",
          body: JSON.stringify({
            name,
            zh_name: qs("#subZhName").value.trim(),
            module_kind: currentModuleKind(page)
          })
        });
        closeModal();
        showToast("子分类已创建");
        await loadModuleData(page);
        renderCards(page);
      } catch (error) {
        qs("#subErr").textContent = error.message;
      }
    }

    function createRootCategory(page) {
      qs("#modalRoot").classList.remove("hidden");
      qs("#modalRoot").innerHTML = `
        <div class="modal">
          <h3>新建主分类</h3>
          <div class="form-grid">
            <div class="form-row"><label>命名空间</label><input id="rootCatName" placeholder="例如 optimizer" /></div>
            <div class="form-row"><label>中文文件夹名</label><input id="rootCatZhName" placeholder="例如 优化算法" /></div>
          </div>
          <div class="field-error" id="rootCatErr"></div>
          <div class="modal-actions">
            <button onclick="window.closeModal()">取消</button>
            <button class="primary" onclick="window.saveRootCategory('${esc(page)}')">创建</button>
          </div>
        </div>
      `;
    }

    async function saveRootCategory(page) {
      const name = qs("#rootCatName").value.trim();
      if (!/^[a-z_][a-z0-9_]*$/.test(name)) {
        qs("#rootCatErr").textContent = "主分类命名空间只能使用小写字母、数字和下划线";
        return;
      }
      try {
        await api("/api/v1/categories", {
          method: "POST",
          body: JSON.stringify({
            name,
            zh_name: qs("#rootCatZhName").value.trim(),
            module_kind: currentModuleKind(page)
          })

    function defaultAlgorithmCode(name) {
      const funcName = name || "my_algorithm";
      return `def ${funcName}(data: list, threshold: float = 0.5) -> dict:\n    \"\"\"在这里编写算法逻辑。\n\n    Args:\n        data: 输入数据。\n        threshold: 阈值参数。\n    \"\"\"\n    passed = [item for item in data if float(item) >= threshold]\n    return {\n        \"input_count\": len(data),\n        \"passed_count\": len(passed),\n        \"passed\": passed,\n    }\n`;
    }

    function newTemplateFiles(kind, name, templateKey) {
      const funcName = name || (kind === "complex" ? "complex_algorithm" : "my_algorithm");
      if (kind === "complex" || templateKey === "complex") return defaultComplexFiles(funcName);
      const code = templateKey === "quality"
        ? `def ${funcName}(rows: list[dict], required_columns: list[str]) -> dict:\n    \"\"\"数据质量检查示例。\"\"\"\n    issues = []\n    for row_index, row in enumerate(rows):\n        for column in required_columns:\n            if column not in row or row[column] in (None, \"\"):\n                issues.append({\"row\": row_index, \"column\": column, \"rule\": \"required\"})\n    return {\"row_count\": len(rows), \"issue_count\": len(issues), \"issues\": issues}\n`
        : defaultAlgorithmCode(funcName);
      return [{ relative_path: `${funcName}.py`, content: code }];
    }

    function applyWorkspaceTemplate() {
      updateWorkspaceFileContent();
      const templateKey = qs("#wsTemplate").value;
      if (templateKey === "complex") qs("#wsKind").value = "complex";
      const kind = qs("#wsKind").value;
      const fallback = kind === "complex" ? "complex_algorithm" : "my_algorithm";
      const name = qs("#wsName").value.trim() || fallback;
      newAlgoState.savedId = "";
      newAlgoState.packageId = "";
      newAlgoState.files = newTemplateFiles(kind, name, templateKey);
      newAlgoState.currentFile = newAlgoState.files[0].relative_path;
      initWorkspaceEditor();
    }

    async function initWorkspaceEditor() {
      const m = await loadMonaco();
      if (state.workspaceEditor) {
        state.workspaceEditor.dispose();
        state.workspaceEditor = null;
      }
      state.workspaceModels.forEach(model => {
        if (model && !model.isDisposed()) model.dispose();
      });
      state.workspaceModels.clear();
      newAlgoState.files.forEach(file => {
        const uri = m.Uri.parse(`inmemory://algolib-new/${encodeURIComponent(file.relative_path)}`);
        const existing = m.editor.getModel(uri);
        if (existing && !existing.isDisposed()) existing.dispose();
        const model = m.editor.createModel(file.content || "", "python", uri);
        state.workspaceModels.set(file.relative_path, model);
        updateModelDiagnostics(model);
      });
      renderWorkspaceFiles();
      state.workspaceEditor = m.editor.create(qs("#wsMonacoHost"), {
        model: state.workspaceModels.get(newAlgoState.currentFile),
        theme: "algolib-dark",
        language: "python",
        automaticLayout: true,
        fontSize: 14,
        tabSize: 4,
        autoIndent: "full",
        folding: true,
        bracketPairColorization: { enabled: true },
        quickSuggestions: { other: true, comments: false, strings: false },
        minimap: { enabled: true }
      });
      window._activeMonaco = state.workspaceEditor;
      state.workspaceEditor.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.KeyS, () => saveWorkspaceAlgorithm(currentModuleKind(newAlgoState.page)));
      state.workspaceEditor.onDidChangeModelContent(() => {
        window.clearTimeout(state.workspaceLintTimer);
        state.workspaceLintTimer = window.setTimeout(() => updateModelDiagnostics(state.workspaceEditor.getModel()), 250);
      });
    }

    function renderWorkspaceFiles() {
      qs("#wsFileList").innerHTML = newAlgoState.files.map(file => {
        const funcs = parsePythonFunctions(state.workspaceModels.get(file.relative_path)?.getValue() || file.content || "").map(fn => fn.func_name);
        return `<button class="${file.relative_path === newAlgoState.currentFile ? "active" : ""}" onclick="window.switchWorkspaceFile('${esc(file.relative_path)}')"><strong>${esc(file.relative_path)}</strong><br><small>${funcs.length ? `def ${esc(funcs.join(", "))}` : "未检测到函数"}</small></button>`;
      }).join("");
    }

    function switchWorkspaceFile(path) {
      updateWorkspaceFileContent();
      newAlgoState.currentFile = path;
      if (state.workspaceEditor && state.workspaceModels.has(path)) {
        state.workspaceEditor.setModel(state.workspaceModels.get(path));
        updateModelDiagnostics(state.workspaceModels.get(path));

      renderWorkspaceFiles();

    function updateWorkspaceFileContent() {
      const file = newAlgoState.files.find(item => item.relative_path === newAlgoState.currentFile);

    async function saveWorkspaceAlgorithm(moduleKind) {
      updateWorkspaceFileContent();
      for (const file of newAlgoState.files) {
        if (state.workspaceModels.has(file.relative_path)) file.content = state.workspaceModels.get(file.relative_path).getValue();
        astLintOrThrow(file.content, file.relative_path);
      }
      const kind = qs("#wsKind").value;
      const name = qs("#wsName").value.trim();
      const namespace = qs("#wsCategory").value.trim().replace(/^alg\./, "");
      const tags = qs("#wsTags").value.split(",").map(item => item.trim()).filter(Boolean);
      try {
        if (newAlgoState.savedId) {
          if (kind === "complex" && newAlgoState.packageId) {
            for (const file of newAlgoState.files) {
              await api(`/api/v1/packages/${safeId(newAlgoState.packageId)}/files/${safeId(file.relative_path)}`, {
                method: "POST",
                body: JSON.stringify({ content: file.content })
              });
            }
          } else {
            await api(`/api/v1/algorithm-source/${safeId(newAlgoState.savedId)}/save`, {
              method: "POST",
              body: JSON.stringify({ content: newAlgoState.files[0].content })
            });
          }
          showToast("草稿内容已更新，点击测试进入测试界面");
          return;
        }
        if (kind === "complex") {
          const result = await api("/api/v1/packages/create", {
            method: "POST",
            body: JSON.stringify({
              name,
              namespace,
              zh_name: qs("#wsZhName").value.trim(),
              version: "1.0.0",
              entry: "main.py",
              exports: [name],
              zh_description: qs("#wsDesc").value.trim(),
              zh_tags: tags,
              module_kind: moduleKind,
              published: false,
              publish_status: "draft",
              files: newAlgoState.files
            })
          });
          newAlgoState.savedId = result.algorithm?.id || `${namespace}.${name}`;
          newAlgoState.packageId = result.package?.package_id || result.package?.id || name;
        } else {
          const result = await api("/api/v1/algorithms/create", {
            method: "POST",
            body: JSON.stringify({
              name,
              category: namespace,
              zh_name: qs("#wsZhName").value.trim(),
              zh_description: qs("#wsDesc").value.trim(),
              zh_tags: tags,
              version: "1.0.0",
              code: newAlgoState.files[0].content,
              module_kind: moduleKind,
              publish_status: moduleKind === "template" ? "published" : "draft"
            })
          });
          newAlgoState.savedId = result.algorithm?.id || `${namespace}.${name}`;
        }
        showToast("算法已保存为草稿，仍停留在当前编辑界面；点击测试进入测试面板");
      } catch (error) {
        showToast(error.message);
      }
    }

    async function saveNewAlgorithm(moduleKind) {
      const name = qs("#algName").value.trim();
      const category = qs("#algCategory").value.trim();
      if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
        showToast("函数名必须是合法 Python 标识符");
        return;
      }
      if (!category) {
        showToast("所属类别不能为空");
        return;
      }
      const payload = {
        name,
        category,
        zh_name: qs("#algZhName").value.trim(),
        zh_description: qs("#algDesc").value.trim(),
        zh_tags: qs("#algTags").value.split(",").map(item => item.trim()).filter(Boolean),
        version: qs("#algVersion").value.trim() || "1.0.0",
        code: qs("#algCode").value,
        module_kind: moduleKind,
        publish_status: moduleKind === "template" ? "published" : "draft"
      };
      try {
        const result = await api("/api/v1/algorithms/create", {
          method: "POST",
          body: JSON.stringify(payload)
        });

        showToast(moduleKind === "template" ? "模板已创建" : "组件草稿已创建");

        showToast(error.message);
      }
    }

    function defaultComplexFiles(name) {
      const funcName = name || "complex_algorithm";
      return [
        {
          relative_path: "main.py",
          content: `from algo_service.sdk.decorators import algo_meta\nfrom .preprocess import clean_values\nfrom .model import score_values\n\n\n@algo_meta(\n    zh_name=\"复杂算法示例\",\n    zh_description=\"多文件复杂算法入口，演示预处理、模型逻辑和结果封装。\",\n    zh_tags=[\"复杂算法\", \"多文件\"],\n    version=\"1.0.0\",\n)\ndef ${funcName}(data: list[float], threshold: float = 0.5) -> dict:\n    values = clean_values(data)\n    scores = score_values(values)\n    passed = [value for value, score in zip(values, scores) if score >= threshold]\n    return {\n        \"input_count\": len(data),\n        \"valid_count\": len(values),\n        \"scores\": scores,\n        \"passed\": passed,\n        \"threshold\": threshold,\n    }\n`
        },
        {
          relative_path: "preprocess.py",
          content: `def clean_values(data: list[float]) -> list[float]:\n    values = []\n    for item in data:\n        if item is None:\n            continue\n        values.append(float(item))\n    return values\n`
        },
        {
          relative_path: "model.py",
          content: `def score_values(values: list[float]) -> list[float]:\n    if not values:\n        return []\n    low = min(values)\n    high = max(values)\n    if low == high:\n        return [1.0 for _ in values]\n    return [round((value - low) / (high - low), 6) for value in values]\n`
        }
      ];
    }
