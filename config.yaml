server:
  host: "0.0.0.0"
  port: 8000

# Directories containing algorithm Python files.
# Paths are relative to the project root (where config.yaml lives).
watch_directories:
  - "./algorithms_root"

# Restrict CORS if needed; "*" allows any origin (development default).
cors_origins:
  - "*"

# Admin token used by publish approval/rejection routes.
admin_token: "change-me-admin-token"
